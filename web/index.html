<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20h Studenten-Tracker</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <h1>20h Studenten-Tracker</h1>
      <p class="subtitle">Wöchentliche Arbeitszeiten erfassen und 6-Wochen-Schnitt prüfen</p>

      <section class="cards">
        <article class="card">
          <h2>6-Wochen Durchschnitt</h2>
          <p id="average" class="value">0.00 h</p>
        </article>
        <article class="card">
          <h2>Status</h2>
          <p id="status" class="value">-</p>
        </article>
        <article class="card">
          <h2>Erfasste Wochen</h2>
          <p id="weekCount" class="value">0 / 6</p>
        </article>
      </section>

      <section class="panel">
        <h2>Woche erfassen / aktualisieren</h2>
        <form id="entryForm">
          <label>
            Wochenstart (Montag)
            <input type="date" id="weekStart" required />
          </label>
          <label>
            Stunden
            <input type="number" id="hours" min="0" max="60" step="0.25" required />
          </label>
          <label>
            Notiz (optional)
            <input type="text" id="note" maxlength="200" placeholder="z. B. Klausurenphase" />
          </label>
          <button type="submit">Speichern</button>
        </form>
      </section>

      <section class="panel">
        <h2>Einträge</h2>
        <table>
          <thead>
            <tr>
              <th>Woche (Montag)</th>
              <th>Stunden</th>
              <th>Notiz</th>
              <th>Aktion</th>
            </tr>
          </thead>
          <tbody id="entriesBody"></tbody>
        </table>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
